<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fondo degradado -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Marco redondeado -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />

  <!-- Tarjeta interior estilo editor -->
  <rect x="12" y="12" width="40" height="40" rx="6" fill="#0f172a" />

  <!-- Botones de macOS -->
  <circle cx="18" cy="18" r="1.8" fill="#ef4444" />
  <circle cx="23" cy="18" r="1.8" fill="#eab308" />
  <circle cx="28" cy="18" r="1.8" fill="#22c55e" />

  <!-- Símbolo de código </ > -->
  <text x="32" y="38" font-family="monospace" font-weight="bold" font-size="15" fill="#a855f7" text-anchor="middle">&lt;/&gt;</text>
</svg>
