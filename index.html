<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSCode</title>

  <link rel="shortcut icon" href="favicon.svg" type="image/x-icon">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Prism.js CSS (Tema Dark) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
  
  <!-- Archivo CSS Local -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col md:flex-row">

  <!-- PANEL DE CONTROLES (IZQUIERDA) -->
  <aside class="w-full md:w-96 p-6 bg-slate-800/80 border-r border-slate-700 flex flex-col gap-5 overflow-y-auto">
    <h1 class="text-xl font-bold tracking-wide text-indigo-400">SSCode</h1>

    <!-- Nombre de Archivo -->
    <div>
      <label class="block text-xs font-semibold mb-1 text-slate-400">Nombre del archivo</label>
      <input type="text" id="fileNameInput" value="contacto.html" placeholder="ej: index.js, main.py" 
        class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-500">
    </div>

    <!-- Selección de Lenguaje -->
    <div>
      <label class="block text-xs font-semibold mb-1 text-slate-400">Lenguaje</label>
      <select id="languageSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-500">
        <option value="markup">HTML</option>
        <option value="javascript">JavaScript</option>
        <option value="python">Python</option>
        <option value="css">CSS</option>
      </select>
    </div>

    <!-- Selección de Fondo (Gradients) -->
    <div>
      <label class="block text-xs font-semibold mb-2 text-slate-400">Fondo del marco</label>
      <div id="bgOptions" class="flex gap-2">
        <button data-bg="from-indigo-500 via-purple-500 to-pink-500" class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 ring-2 ring-indigo-400 focus:outline-none"></button>
        <button data-bg="from-cyan-500 via-blue-500 to-indigo-500" class="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-500 via-blue-500 to-indigo-500 focus:outline-none"></button>
        <button data-bg="from-emerald-400 via-teal-500 to-cyan-600" class="w-8 h-8 rounded-full bg-gradient-to-tr from-emerald-400 via-teal-500 to-cyan-600 focus:outline-none"></button>
        <button data-bg="from-amber-400 via-orange-500 to-red-500" class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-400 via-orange-500 to-red-500 focus:outline-none"></button>
        <button data-bg="from-slate-700 via-slate-800 to-slate-900" class="w-8 h-8 rounded-full bg-gradient-to-tr from-slate-700 via-slate-800 to-slate-900 focus:outline-none"></button>
      </div>
    </div>

    <!-- Padding Adaptable -->
    <div>
      <div class="flex justify-between items-center mb-1">
        <label class="text-xs font-semibold text-slate-400">Espaciado del marco (Padding)</label>
        <span id="paddingValue" class="text-xs text-indigo-400 font-mono">40px</span>
      </div>
      <input type="range" id="paddingInput" min="16" max="96" value="40" class="w-full accent-indigo-500 cursor-pointer">
    </div>

    <!-- Área de Texto de Código -->
    <div>
      <label class="block text-xs font-semibold mb-1 text-slate-400">Código</label>
      <textarea id="codeInput" rows="8" placeholder="Escribí o pegá tu código..." 
        class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 font-mono text-sm focus:outline-none focus:border-indigo-500 resize-none"><html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi primera página</title>
</head>
<body>
  <h1>Mi web</h1>
</body>
</html></textarea>
    </div>

    <!-- Botón Descargar -->
    <button id="downloadBtn" class="mt-auto bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-lg transition-colors flex items-center justify-center gap-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
      Descargar Imagen
    </button>
  </aside>

  <!-- ÁREA DE PREVIEW (DERECHA) -->
  <main class="flex-1 p-8 flex items-center justify-center bg-slate-950 overflow-auto">
    
    <!-- TARJETA A CAPTURAR -->
    <div id="exportCard" class="bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 rounded-xl shadow-2xl transition-all" style="padding: 40px;">
      <div class="bg-slate-900 rounded-lg shadow-2xl min-w-[320px] max-w-2xl border border-slate-800/60 overflow-hidden">
        
        <!-- Barra superior estilo macOS -->
        <div class="px-4 py-3 bg-slate-900/90 flex items-center justify-between border-b border-slate-800">
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full bg-red-500"></div>
            <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
            <div class="w-3 h-3 rounded-full bg-green-500"></div>
          </div>
          <span id="fileNameDisplay" class="text-xs font-mono text-slate-400 select-none">contacto.html</span>
          <div class="w-12"></div>
        </div>

        <!-- Bloque de código procesado -->
        <div class="p-5 font-mono text-sm overflow-x-auto">
          <pre><code id="codeDisplay" class="language-markup"></code></pre>
        </div>

      </div>
    </div>

  </main>

  <!-- LIBRERÍAS EXTERNAS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>

  <!-- LÓGICA JAVASCRIPT -->
  <script src="app.js"></script>
</body>
</html>
